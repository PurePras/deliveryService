# Production deployment. See docs/DEPLOYMENT.md for the full server setup.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Deliberately no `ports:` — only the backend, inside the compose network, talks to
    # Postgres. Use `docker compose exec db psql ...` for ad-hoc access instead.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      LOG_FORMAT: ${LOG_FORMAT}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES}
      OTP_DEV_LOG_CODES: ${OTP_DEV_LOG_CODES}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No `ports:` either — only nginx (below) is reachable from outside the host.

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Bind-mounted (not baked into the image) so scripts/init-letsencrypt.sh can swap
      # in the HTTPS config and reload nginx without a rebuild.
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renews twice a day (certbot no-ops unless the cert is within 30 days of expiry),
    # then reloads nginx so a renewed cert actually gets picked up.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot -q; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  certbot_conf:
  certbot_www:
