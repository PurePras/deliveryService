# Default, works-out-of-the-box config: plain HTTP, no domain/TLS required. Serves the
# built frontend and reverse-proxies /api/* to the backend. This is the only config
# active until scripts/init-letsencrypt.sh has been run — see docs/DEPLOYMENT.md.
server {
    listen 80;
    server_name _;

    # Answers Let's Encrypt's HTTP-01 challenge once a domain is pointed here — kept
    # active even before HTTPS is enabled so init-letsencrypt.sh can request the first
    # certificate without any other config changes.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    # Same top-level path space as the SPA's own client-side routes (e.g. /products),
    # so the API is namespaced under /api and stripped back off before it reaches the
    # backend, which knows nothing about the prefix.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback: unknown paths (client-side routes like /products/:id) get
        # index.html and react-router takes over, instead of a bare nginx 404.
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
