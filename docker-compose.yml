services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shri_ram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shri_ram}
      POSTGRES_DB: ${POSTGRES_DB:-shri_ram_service}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shri_ram} -d ${POSTGRES_DB:-shri_ram_service}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
